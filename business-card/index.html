<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Card</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="grandes-almacenes.png" type="image/x-icon">
</head>
<body>
    <div class="card">
        <div class="left">
            <div class="photo">
                <img src="avatar.jpg" alt="Avatar">
            </div>
        </div>
        <div class="right">
            <h2>John Doe</h2>
            <p class="title">Web Developer</p>
            <div class="info">
                <div>+1 (123) 456-7890</div>
                <div>john@example.com</div>
                <div>www.johndoe.com</div>
            </div>
        </div>
    </div>
</body>
</html>
