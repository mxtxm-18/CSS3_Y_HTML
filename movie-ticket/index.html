<!-- DFMDP - HTML y CSS -->
<!-- Define el tipo de documento HTML5 -->
<!DOCTYPE html>
<!-- Idioma de la página: español -->
<html lang="es">
<head>
  <!-- Codificación de caracteres -->
  <meta charset="UTF-8">
  <!-- Vista adaptable a dispositivos -->
  <meta name="viewport" content="width=device-width,
    initial-scale=1.0">
  <!-- Título de la página -->
  <title>Movie Ticket</title>
  <link rel="stylesheet" href="style.css">
  <link rel="shortcut icon" href="viendo-una-pelicula.png" type="image/x-icon">
</head>
<body>
  <!-- Contenedor principal del boleto -->
  <div class="ticket">
    <!-- Parte superior del boleto -->
    <div class="top">
      <!-- Título de la película -->
      <h2>Cinema</h2>
      <!-- Subtítulo de la película -->
      <div class="movie-title">CS Film</div>
    </div>
    <!-- Parte inferior del boleto -->
    <div class="bottom">
      <!-- Información de la fecha -->
      <div class="info">
        <div>DATE</div>
        <span>SEP 28</span>
      </div>
      <!-- Información de la hora -->
      <div class="info" style="text-align: center;">
        <div>TIME</div>
        <span>20:00</span>
      </div>
      <!-- Información de asiento -->
      <div class="info" style="text-align: right;">
        <div>SEAT</div>
        <span>A12</span>
      </div>
    </div>
  </div>
</body>
</html>
